[package]
name = "sustain-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Music library and player"
license.workspace = true
publish.workspace = true
homepage = "https://github.com/open-sustain/sustain"
repository = "https://github.com/open-sustain/sustain"
authors = ["AnnoyingTechnology"]

[[bin]]
name = "sustain"
path = "src/main.rs"

[features]
default = ["optical"]
# Links MusicBrainz libdiscid for audio-CD ripping. On for the Debian
# package (which depends on libdiscid0); the Flatpak build turns it off via
# `--no-default-features` because the GNOME runtime ships no libdiscid and
# Flatpak CD-drive access is out of scope. With it off the app still builds
# and runs — the optical probe simply finds no drive — so the binary is
# always usable.
optical = ["sustain-cd-import/optical"]

[dependencies]
directories = "6.0.0"
rustix = { version = "1", features = ["fs"] }
sustain-app-runtime = { path = "../app_runtime" }
# Composition root for the CD-import backend. The `optical` feature above
# forwards to this crate's libdiscid-backed probe; it is the only place
# libdiscid is linked, so the Debian package ships full CD-import support
# (and depends on libdiscid0) while the Flatpak build omits it.
sustain-cd-import = { path = "../cd_import", default-features = false }
sustain-i18n = { path = "../i18n" }
sustain-library-store = { path = "../library_store" }
sustain-metadata = { path = "../metadata" }
sustain-metadata-remote = { path = "../metadata_remote" }
sustain-playback = { path = "../playback" }
sustain-profiler = { path = "../profiler" }
sustain-settings = { path = "../settings" }
sustain-ui-gtk = { path = "../ui_gtk" }

[lints]
workspace = true

[package.metadata.deb]
name = "sustain"
maintainer = "Sustain contributors <https://github.com/open-sustain/sustain>"
section = "sound"
priority = "optional"
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, libdiscid0, librsvg2-common"
recommends = "yt-dlp, ffmpeg, gvfs-backends"
extended-description = """
Sustain is a Linux desktop music player in the lineage of 2010s iTunes.
The product target is the dense, predictable library workflow of that
era: a fast table over your local files, with playlists, smart
playlists, ratings, listening statistics, instant search, and optional
library management.

Built in Rust against GTK4 and GStreamer; no web wrapper, no Electron.
Optimised for a 10,000+ track library: instant search, smooth scrolling,
fast cold start.

Library views:
 * Music — dense, keyboard-friendly track table
 * Albums — full-width album-cover grid, plays album-scoped on click
 * Playlists — per-playlist track tables in a collapsible sidebar

Key features:
 * Smart playlists and playlist folders, with tempo- and harmony-aware
   rules (BPM, Music Key)
 * 5-star ratings, play count, skip count, last played, last skipped
 * Up Next queue (Play Next, Add to Queue)
 * Background BPM / key / waveform analysis with paced resource use
 * Online artwork, tag, and lyrics fetching via MusicBrainz, Cover Art
   Archive, Deezer, the iTunes Search API, and LRClib
 * Native light and dark themes with the system accent color
 * Two library modes: leave files in place, or keep the library
   organised on disk
"""
assets = [
    ["target/release/sustain", "usr/bin/", "755"],
    # Localization artifacts built by `cargo xtask i18n-compile` (run it before
    # `cargo deb`): one catalog per locale in po/LINGUAS, plus the desktop entry
    # and AppStream metadata with every translation merged in. The glob keeps
    # each catalog's `<lang>/LC_MESSAGES/` path under /usr/share/locale.
    ["../../target/i18n/dist/io.github.open_sustain.sustain.desktop", "usr/share/applications/", "644"],
    ["../../target/i18n/dist/io.github.open_sustain.sustain.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../target/i18n/dist/locale/**/*.mo", "usr/share/locale/", "644"],
    # Attribution for the statically linked Rust crate graph (generated by
    # cargo-about; see THIRD-PARTY-LICENSES.md and about.toml). cargo-deb
    # already emits /usr/share/doc/sustain/copyright for Sustain's own
    # GPL-3.0-or-later license; this is the third-party complement.
    ["../../THIRD-PARTY-LICENSES.md", "usr/share/doc/sustain/THIRD-PARTY-LICENSES.md", "644"],
    # The vendored `sustain-dsp` crate is MIT OR Apache-2.0 third-party code,
    # but cargo-about ignores private workspace crates, so it is absent from
    # the inventory above. Ship its notices directly (see crates/dsp/PROVENANCE.md
    # and docs/licensing.md).
    ["../dsp/LICENSE-MIT", "usr/share/doc/sustain/sustain-dsp/LICENSE-MIT", "644"],
    ["../dsp/LICENSE-APACHE", "usr/share/doc/sustain/sustain-dsp/LICENSE-APACHE", "644"],
    ["../../data/icons/hicolor/scalable/apps/io.github.open_sustain.sustain.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../data/icons/hicolor/scalable/actions/sustain-statistics-symbolic.svg", "usr/share/icons/hicolor/scalable/actions/", "644"],
]
