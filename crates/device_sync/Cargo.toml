[package]
name = "sustain-device-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sustain_device_sync"
path = "src/lib.rs"

[dependencies]
# Durable value types (SyncDevice, manifest, layouts) and the neutral
# track/playlist models the engine resolves against.
sustain-domain = { path = "../domain" }
# Pioneer on-drive writer for the Pioneer layout.
sustain-pioneer = { path = "../pioneer" }
# Root-confined removable-media writes: safe openat/mkdirat/renameat/unlinkat
# wrappers let the sync engine anchor every operation to one mount-root fd.
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
# Scratch device roots for the writer/diff tests.
tempfile = "3"
