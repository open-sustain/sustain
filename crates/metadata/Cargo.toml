[package]
name = "sustain-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sustain_metadata"
path = "src/lib.rs"

[dependencies]
lofty = "0.24.0"
# Linux fd-based atomic audio-file replacement: no-follow opens, exclusive
# sibling staging, ownership/mode/xattr preservation, renameat, and fsync.
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.11.0"
sustain-domain = { path = "../domain" }

[lints]
workspace = true
