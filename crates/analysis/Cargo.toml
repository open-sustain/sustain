[package]
name = "sustain-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sustain_analysis"
path = "src/lib.rs"

[dependencies]
# Audio decoding. Format features cover the spread Sustain claims to
# import — MP3, M4A/AAC, FLAC, Ogg/Vorbis, WAV. We do not enable
# `isomp4` features that would bring in additional non-music codecs.
# The PCM codec the WAV reader needs is supplied by symphonia's default
# features, which this dependency keeps enabled (it does not set
# `default-features = false`). 0.6 brings SIMD-by-default decode,
# decode-from-non-owning-packets, and the hardened MP4/MKV demuxers.
symphonia = { version = "0.6", features = ["mp3", "aac", "flac", "wav", "ogg", "vorbis"] }
# BPM + key + STFT + spectral-flux onsets + BS.1770 loudness. Vendored,
# trimmed minimal DSP core (was the published `stratum-dsp` crate; see
# crates/dsp/PROVENANCE.md). Takes mono f32 samples / a magnitude
# spectrogram and a sample rate; returns BPM + a `Key` we map onto
# sustain_domain::MusicalKey.
sustain-dsp = { path = "../dsp" }
# Digital biquad IIR filters for the 3-band split (low/mid/high) used
# to produce per-segment frequency-band energies for the waveform.
biquad = "0.6"
# Error chaining for the public AnalysisError surface.
thiserror = "2.0"
# Domain-layer types (MusicalKey).
sustain-domain = { path = "../domain" }

[dev-dependencies]
# Scratch files for the decode/seek tests, which generate small WAVs on
# disk and need them cleaned up regardless of test outcome.
tempfile = "3"

[lints]
workspace = true
