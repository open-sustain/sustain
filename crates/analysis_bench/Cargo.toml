[package]
name = "sustain-analysis-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Developer/validation tooling for the audio-analysis pipeline. Not a
# shipped `sustain-*` runtime crate and not linked into the `sustain`
# binary, so it has no bearing on the cold-start budget. It drives the
# public `sustain_analysis::Analyzer` over a manifest of fixtures or
# private real-audio corpora, records the outputs + timings, and scores
# them against ground truth. The harness is what keeps "best in class"
# BPM/key/loudness honest: we measure before we change the DSP.

[lib]
name = "sustain_analysis_bench"
path = "src/lib.rs"

[[bin]]
name = "analysis-bench"
path = "src/main.rs"

[dependencies]
# The harness exercises the real analyzer through its public surface;
# it never reaches into DSP internals.
sustain-analysis = { path = "../analysis" }
# Domain types the analyzer reports (MusicalKey, AcousticFeatures, …).
sustain-domain = { path = "../domain" }
# Manifest (TOML in) and results/baselines (JSON out).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
# Typed error surface for manifest loading.
thiserror = "2.0"

[dev-dependencies]
# Synthetic fixtures are rendered to a scratch directory for the
# determinism tests and cleaned up regardless of outcome.
tempfile = "3"

[lints]
workspace = true
