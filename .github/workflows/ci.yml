name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Callable by the Release workflow so artifact publication can gate on the
  # exact tagged commit passing this full suite. The `ref` input is threaded
  # into every checkout; left empty (push/PR/dispatch) it falls back to the
  # triggering ref, so day-to-day CI is unchanged.
  workflow_call:
    inputs:
      ref:
        description: Commit, tag, or branch to verify (defaults to the triggering ref).
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Build jobs run inside debian:trixie-slim because the workspace requires
  # GTK >= 4.18 (Cargo.toml: `features = ["v4_18"]`). Ubuntu 24.04 ships
  # GTK 4.14; Debian trixie ships 4.18. This also matches the project's
  # Debian-first target platform.
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Nursery lint membership is unstable. Keep the Clippy ratchet on
          # the same reviewed toolchain declared in rust-toolchain.toml.
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            xvfb xauth
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The sustain-ui-gtk widget-smoke tests init GTK and map widgets, which
      # brings up GTK's default GL renderer. Under xvfb's llvmpipe GL stack
      # that renderer SIGSEGVs during teardown at process exit, crashing the
      # test binary *after* all tests pass. These tests exercise widget/model
      # logic, not the GPU path, so force the software (cairo) renderer and
      # keep GL out of the headless run entirely.
      - run: GDK_DISABLE=gl GSK_RENDERER=cairo xvfb-run -a cargo test --workspace --locked --no-fail-fast

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo doc --workspace --locked --no-deps --document-private-items

  # Localization catalog gate. xtask shells out to GNU gettext, and the
  # rust-format extraction it relies on needs gettext >= 0.24 — Debian trixie
  # ships 0.23.1, so this job runs on debian:testing (gettext 0.26). `cargo run
  # -p xtask` has no third-party dependencies, so no GTK/GStreamer dev packages
  # are needed; build-essential supplies the linker. (xtask's own unit tests are
  # pure and run in the main `test` job.)
  i18n:
    name: i18n catalogs
    runs-on: ubuntu-24.04
    container:
      image: debian:testing-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential gettext
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Validate catalogs and template
        run: cargo run --locked -p xtask -- i18n-check

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  # Where cargo-deny gates the inbound SPDX expressions, this job gates the
  # shipped attribution file: it regenerates THIRD-PARTY-LICENSES.md from the
  # locked graph and fails if it differs from the committed copy, so a
  # dependency change that alters the third-party license set cannot land
  # without its regenerated inventory in the same change. cargo-about is not
  # in taiki-e/install-action's catalogue, so it is built from crates.io,
  # pinned to the version the committed file was generated with for a stable,
  # reproducible diff. No GTK/GStreamer dev packages are needed: cargo-about
  # only reads cargo metadata and the crates' own license files.
  licenses:
    name: cargo-about
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.0 --locked --features cli
      - name: Regenerate third-party license inventory
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.md
      - name: Fail on drift
        run: |
          git diff --exit-code -- THIRD-PARTY-LICENSES.md || {
            echo "::error::THIRD-PARTY-LICENSES.md is out of date. Regenerate with:"
            echo "::error::  cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.md"
            exit 1
          }

  machete:
    name: cargo-machete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-machete
      - run: cargo machete

  typos:
    name: typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1
