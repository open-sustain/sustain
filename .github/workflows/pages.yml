name: Deploy website

# Publishes the static site in website/ to GitHub Pages, with the user
# documentation built from docs/ by mdBook under /docs/. Only runs when the
# site, the documentation (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy are separate jobs, as in GitHub's Pages starter
# workflows: deploy-pages looks the artifact up by listing the run's
# artifacts, and a listing made right after the upload, in the same job,
# can miss it (actions/deploy-pages#451).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build docs --dest-dir "$GITHUB_WORKSPACE/website/docs"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
