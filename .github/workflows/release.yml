name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or ref to build (e.g. v0.1.0)
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full CI-equivalent verification of the exact ref being released
  # (fmt, clippy, tests, rustdoc, cargo-deny, cargo-machete, typos).
  # `publish-release` depends on this, so artifacts can never be attached
  # for a ref whose CI is red — the gap that let v0.6.0-alpha.3 publish
  # while CI on the same commit failed. The recovery/manual-dispatch path
  # is covered too: the `ref` input is threaded into the called workflow.
  verify:
    name: Verify (CI-equivalent)
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  # Build inside debian:trixie-slim so the .deb links against Debian's
  # GTK 4.18 / glibc, matching the target platform. Ubuntu 24.04 ships
  # GTK 4.14 which is too old for the workspace's `v4_18` feature.
  #
  # The amd64 and arm64 jobs differ only in the GitHub-hosted runner
  # they sit on (`ubuntu-24.04` vs `ubuntu-24.04-arm`); both pull the
  # multi-arch `debian:trixie-slim` image so Debian's packaging policy
  # is identical across architectures.
  deb-amd64:
    name: Build .deb (debian-trixie / amd64)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2
        with:
          tool: cargo-deb

      - name: Build release .deb
        run: cargo deb -p sustain-app --locked

      - name: Locate artifact
        id: artifact
        run: |
          DEB=$(ls target/debian/*.deb | head -n1)
          echo "path=${DEB}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${DEB}")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  deb-arm64:
    name: Build .deb (debian-trixie / arm64)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2
        with:
          tool: cargo-deb

      - name: Build release .deb
        run: cargo deb -p sustain-app --locked

      - name: Locate artifact
        id: artifact
        run: |
          DEB=$(ls target/debian/*.deb | head -n1)
          echo "path=${DEB}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${DEB}")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  # Verify the Debian-trixie .deb installs cleanly on Ubuntu's two
  # supported targets: the current interim release (25.10) and the
  # current LTS (26.04). `apt-get install ./pkg.deb` performs full
  # dependency resolution against the target distro's archives, so a
  # successful run here proves the Trixie-built package is consumable
  # by Ubuntu without a per-release rebuild. If a future Ubuntu
  # release ships an incompatible GTK 4 ABI, this job fails and we
  # then know to add a per-Ubuntu builder.
  verify-ubuntu:
    name: Verify install (${{ matrix.distro }} / ${{ matrix.arch }})
    needs: [deb-amd64, deb-arm64]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: ['ubuntu:25.10', 'ubuntu:26.04']
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - name: Download .deb artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Install the matching .deb
        run: |
          set -euo pipefail
          # `actions/download-artifact` lays each artifact out as
          # `artifacts/<artifact-name>/<file>`, where the artifact name
          # is the .deb's basename — so a `find` without `-type f` would
          # match the directory instead of the file. Anchor on files
          # only, and prefix the path with `./` so apt-get treats it as
          # a local .deb rather than parsing it as a package spec.
          DEB=$(find artifacts -type f -name "sustain_*_${{ matrix.arch }}.deb" -print -quit)
          test -n "${DEB}" || { echo "No sustain_*_${{ matrix.arch }}.deb artifact found"; exit 1; }
          echo "Installing ./${DEB}"
          apt-get install -y --no-install-recommends "./${DEB}"

      - name: Verify install layout
        run: |
          set -euo pipefail
          # Runtime layout: the files the desktop environment consumes must
          # land on the live filesystem after install.
          test -x /usr/bin/sustain
          test -f /usr/share/applications/io.github.open_sustain.sustain.desktop
          test -f /usr/share/metainfo/io.github.open_sustain.sustain.metainfo.xml
          test -f /usr/share/icons/hicolor/128x128/apps/io.github.open_sustain.sustain.png
          dpkg -s sustain | grep -E '^(Package|Version|Architecture|Status):'

          # THIRD-PARTY-LICENSES.md installs under /usr/share/doc, which the
          # minimal ubuntu:/debian: container images used here deliberately
          # strip at unpack time via /etc/dpkg/dpkg.cfg.d/excludes
          # (`path-exclude=/usr/share/doc/*`, keeping only copyright and
          # changelogs). A real Debian/Ubuntu desktop carries no such
          # exclusion and does receive the file, so testing the installed
          # filesystem here would assert the container's doc policy, not the
          # package. The property we actually ship is that the .deb *contains*
          # the third-party license inventory — verify that against the
          # package contents, immune to the host's doc-stripping policy.
          # `grep -q` on a file (not a pipe from dpkg-deb) avoids the
          # SIGPIPE-kills-dpkg-deb / `set -o pipefail` failure mode.
          DEB=$(find artifacts -type f -name "sustain_*_${{ matrix.arch }}.deb" -print -quit)
          dpkg-deb --contents "${DEB}" > /tmp/deb-contents.txt
          grep -qE '/usr/share/doc/sustain/THIRD-PARTY-LICENSES\.md$' /tmp/deb-contents.txt

  # Distro-agnostic build for users on Elementary / Zorin / Mint /
  # Fedora / openSUSE / etc. Targets the org.gnome.Platform//48
  # runtime (GTK 4.18+). Cargo source pinning is regenerated from
  # Cargo.lock at build time via flatpak-cargo-generator.py so the
  # offline cargo build inside flatpak-builder is reproducible and
  # locked to the same revisions cargo would pick on a developer
  # machine.
  flatpak:
    name: Build Flatpak bundle (amd64)
    runs-on: ubuntu-24.04
    container:
      # The flatpak-builder container moved from Docker Hub
      # (bilelmoussaoui/flatpak-github-actions) to the flathub-infra
      # org on ghcr.io. Pinned by immutable digest (tag: gnome-48) so a
      # mutated upstream tag cannot alter release artifacts; bump the
      # digest deliberately when adopting a newer runtime. The image
      # already bundles the generator's Python deps (aiohttp, tomlkit,
      # PyYAML), so no mutable `pip install` runs at release time.
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:50fea670968fd3ec4aeeb3a91d9d807d0af6eab3c3b44c33d4c40c311832c8fa # gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Fetch and verify flatpak-cargo-generator
        run: |
          set -euo pipefail
          # Pin the generator to a reviewed commit of flatpak-builder-tools
          # and verify its SHA-256 before it is ever executed: a moved
          # branch or tampered upstream file fails the release here instead
          # of running with publish credentials in scope.
          GEN_COMMIT=96e2fe8bf7d2e5791ca1bdce2dba373f1e27c425
          GEN_SHA256=b373c8ab1a05378ec5d8ed0645c7b127bcec7d2f7a1798694fbc627d570d856c
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${GEN_COMMIT}/cargo/flatpak-cargo-generator.py" \
            -o /tmp/flatpak-cargo-generator.py
          echo "${GEN_SHA256}  /tmp/flatpak-cargo-generator.py" | sha256sum -c -

      - name: Generate cargo-sources.json
        run: |
          python3 /tmp/flatpak-cargo-generator.py \
            Cargo.lock \
            -o packaging/flatpak/cargo-sources.json

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          bundle: sustain.flatpak
          manifest-path: packaging/flatpak/io.github.open_sustain.sustain.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  # Single point of release attachment. Builders publish workflow
  # artifacts only; this job downloads them and attaches the lot once
  # CI-equivalent verification, install verification, and the Flatpak
  # build have all passed. A broken .deb, a failed install check, or a
  # red CI on the released commit therefore cannot land an artifact on a
  # published release.
  #
  # Fires on either a tag push (normal path) or a workflow_dispatch
  # whose `inputs.ref` is a tag name (recovery path — when a prior
  # run died on a transient failure, the same release can be retried
  # without recutting the tag). When dispatched against a non-tag
  # ref (e.g. testing the build from a branch), publish-release is
  # skipped so the workflow can't accidentally create a release.
  publish-release:
    name: Attach artifacts to GitHub Release
    needs: [verify, verify-ubuntu, flatpak]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the verified ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Record verified commit
        run: |
          set -euo pipefail
          VERIFIED_SHA=$(git rev-parse HEAD)
          {
            echo "## Release verification"
            echo
            echo "Attaching artifacts for ref \`${{ inputs.ref || github.ref_name }}\` at commit \`${VERIFIED_SHA}\`."
            echo
            echo "This commit passed the full CI-equivalent suite (fmt, clippy, tests, rustdoc, cargo-deny, cargo-machete, typos) plus per-package install verification before any artifact was attached."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Collect release files
        id: collect
        run: |
          set -euo pipefail
          # Stage into a name that can't collide with a repo path: the
          # repo root tracks a `release` helper script, so `mkdir -p
          # release` here fails with "File exists" on the checked-out file.
          mkdir -p release-artifacts
          find artifacts -type f \( -name '*.deb' -o -name '*.flatpak' \) \
            -exec cp -v {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # On tag push, `github.ref_name` is the tag (e.g. v0.1.0). On
          # workflow_dispatch, `github.ref_name` is the branch we
          # dispatched from, so we must pull the tag from inputs.ref.
          tag_name: ${{ inputs.ref || github.ref_name }}
