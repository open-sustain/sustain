[default.extend-words]
# Timing-instrumentation variable names. `t0`/`tact`/`tbw`/`trun` are
# short identifiers, not English words; typos misreads `trun` as `turn`.
trun = "trun"
# `typos` splits on hyphens, so hyphenated English compounds with the
# `mis-` prefix (`mis-reported`, `mis-spelled`, ...) trip on the bare
# token `mis`, which it wants to "correct" to `miss`/`mist`.
mis = "mis"
# A Pioneer path-hash test vector reproduces a real on-disk filename
# verbatim ("This Is The Begining.mp3"). The expected hash is computed
# over that exact byte sequence, so the original misspelling must stay.
begining = "begining"
# Valid English ("cannot be parsed"); `typos` only prefers "unparsable".
unparseable = "unparseable"
# GLib/GTK emits CRITICAL log messages, referred to as "criticals" in the
# GTK world — not a misspelling of the adjective "critical".
criticals = "criticals"
# The seek-operation past tense as used throughout the decoder (`let
# seeked = ...`, "seeked to"); idiomatic in code even though English
# prefers "sought".
seeked = "seeked"
# Past participle of the GTK verb `unparent` (`gtk_widget_unparent`): a
# widget "must be unparented before disposal". Not the adjective
# "parentless" that typos wants.
unparented = "unparented"
# `rustix`'s open-flag constant `OFlags::WRONLY` (write-only) in the
# atomic-write and device-sync paths: a verbatim kernel/libc identifier,
# not a misspelling of the adverb "wrongly".
WRONLY = "WRONLY"
# `typos` splits the ID3v2 "Lead performer(s)" frame id `TPE1` at the
# digit, so the alphabetic frame-prefix token is intentional.
TPE = "TPE"

[files]
# THIRD-PARTY-LICENSES.md is generated by `cargo about` from the locked
# dependency graph — it is verbatim third-party content (crate names and
# their full license texts) that we neither author nor may edit by hand.
# Crate names routinely read as typos (`flate2` -> "flate",
# `symphonia-format-caf` -> "caf", the ICU4X `writeable` crate -> "writeable"),
# and any dependency bump can introduce more. The file's only hand-written
# prose lives in `about.hbs`, which typos still scans, so excluding the
# generated output costs no real spell-check coverage.
extend-exclude = ["THIRD-PARTY-LICENSES.md"]
