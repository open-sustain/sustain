[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sustain workspace automation: localization catalog tooling"
license.workspace = true
publish.workspace = true

# Build tooling, not a shipped `sustain-*` crate and not linked into any
# binary. Depends only on the standard library and orchestrates the installed
# GNU gettext tools; it never parses PO/POT itself beyond trivial line work.

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Token-tree parsing for the gettext call-shape guard. proc-macro2 in fallback
# mode tokenizes Rust source and, crucially, descends into macro bodies (so a
# `gettext(...)` nested in `formatx!(...)` is seen), which a syn AST walk would
# treat as opaque. `span-locations` gives line/column for actionable errors.
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
